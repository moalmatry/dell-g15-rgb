[project]
name = "dell-g15-rgb"
version = "0.1.0"
description = "AlienFX RGB keyboard driver, CLI, and GTK 3 GUI for Dell G15 laptops"
authors = [
    { name = "moalmatry" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["dell", "g15", "alienfx", "rgb", "keyboard", "linux"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.urls]
Repository = "https://github.com/moalmatry/dell-g15-rgb"

[project.scripts]
dell-rgb = "dell_g15_rgb.cli:main"
dell-g15-rgb-gui = "dell_g15_rgb.gui:main"

[tool.poetry]
packages = [{ include = "dell_g15_rgb", from = "src" }]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
